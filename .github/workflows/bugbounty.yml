name: bugbounty

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/bugbounty/**"
  pull_request:
    branches:
      - main
    paths:
      - "tools/bugbounty/**"

permissions:
  contents: write

concurrency:
  group: bugbounty-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-killchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build killchain
        run: make -C tools/killchain
      - name: Upload killchain binary
        uses: actions/upload-artifact@v4
        with:
          name: killchain-binary
          path: tools/killchain/out/bin/killchain
          if-no-files-found: error

  info:
    needs: build-killchain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download killchain binary
        uses: actions/download-artifact@v4
        with:
          name: killchain-binary
          path: tools/killchain/out/bin

      - name: Install tools
        run: |
          chmod +x tools/killchain/out/bin/killchain
          sudo apt-get update
          sudo apt-get install -y nmap
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run recon pipeline
        run: |
          chmod +x ./tools/bugbounty/main.sh ./tools/bugbounty/src/*.sh
          for domain in \
            acquisory.com \
            asyncawake.studio \
            ayushmanchhabra.com \
            vaultfol.io; do
            echo "::group::scan $domain"
            # port.sh needs root for killchain's raw sockets; preserve PATH so
            # subfinder/nmap/openssl resolve. Keep going if one target fails.
            sudo env "PATH=$PATH" ./tools/bugbounty/main.sh \
              "$domain" "./tools/bugbounty/targets/$domain" \
              || echo "::warning::recon failed for $domain"
            echo "::endgroup::"
          done
          # Scans ran as root, so the result files are root-owned; hand them back
          # to the runner user or git can't stage them.
          sudo chown -R "$(id -u):$(id -g)" ./tools/bugbounty/targets

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/bugbounty/targets
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(bugbounty): refresh domain info"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
