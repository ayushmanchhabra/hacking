name: bugbounty

on:
  schedule:
      - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "tools/bugbounty/**"

permissions:
  contents: write

jobs:
  info:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Install subfinder
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Run script
        run: |
          sudo apt update
          sudo apt install openssl
          chmod +x ./tools/bugbounty/src/*.sh ./tools/bugbounty/src/main.sh
          ./tools/bugbounty/src/main.sh acquisory.com ./tools/bugbounty/targets/acquisory.com
          ./tools/bugbounty/src/main.sh asyncawake.studio ./tools/bugbounty/targets/asyncawake.studio
          ./tools/bugbounty/src/main.sh ayushmanchhabra.com ./tools/bugbounty/targets/ayushmanchhabra.com
          ./tools/bugbounty/src/main.sh vaultfol.io ./tools/bugbounty/targets/vaultfol.io
          ./tools/bugbounty/src/main.sh bikedekho.com,cardekho.com,channelpartnerutility.com,gaadi.com,girnarsoft.co.in,revv.co.in,rupyy.com,zigwheels.com ./tools/bugbounty/targets/girnarsoft

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(bugbounty): refresh domain info"
            git push origin HEAD:${{ github.ref_name }}
          fi
