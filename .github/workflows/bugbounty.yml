name: bugbounty

on:
  schedule:
      - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/bugbounty/**"
  pull_request:
    branches:
      - main
    paths:
      - "tools/bugbounty/**"

permissions:
  contents: write

jobs:
  build-killchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build killchain
        run: make -C tools/killchain
      - name: Upload killchain binary
        uses: actions/upload-artifact@v7
        with:
          name: killchain-binary
          path: tools/killchain/out/bin/killchain
          if-no-files-found: error

  info:
    needs: build-killchain
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Download killchain binary
        uses: actions/download-artifact@v8
        with:
          name: killchain-binary
          path: tools/killchain/out/bin
      - name: Make killchain binary executable
        run: chmod +x tools/killchain/out/bin/killchain
      - name: Install subfinder
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Run script
        run: |
          sudo apt update
          sudo apt install openssl
          chmod +x ./tools/bugbounty/main.sh ./tools/bugbounty/src/*.sh
          # port.sh (invoked by main.sh) needs root for killchain's raw sockets;
          # run under sudo while preserving PATH so subfinder/openssl resolve.
          sudo env "PATH=$PATH" ./tools/bugbounty/main.sh acquisory.com ./tools/bugbounty/targets/acquisory.com
          sudo env "PATH=$PATH" ./tools/bugbounty/main.sh asyncawake.studio ./tools/bugbounty/targets/asyncawake.studio
          sudo env "PATH=$PATH" ./tools/bugbounty/main.sh ayushmanchhabra.com ./tools/bugbounty/targets/ayushmanchhabra.com
          sudo env "PATH=$PATH" ./tools/bugbounty/main.sh vaultfol.io ./tools/bugbounty/targets/vaultfol.io
          # sudo env "PATH=$PATH" ./tools/bugbounty/main.sh bikedekho.com,cardekho.com,channelpartnerutility.com,gaadi.com,girnarsoft.co.in,revv.co.in,rupyy.com,zigwheels.com ./tools/bugbounty/targets/girnarsoft

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(bugbounty): refresh domain info"
            git push origin HEAD:${{ github.ref_name }}
          fi
