name: ai-harness

services:
  ollama:
    build:
      context: ..
      dockerfile: devops/ai.Dockerfile
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.6}
      OLLAMA_KEEP_ALIVE: 30m
    # Healthy only once the model is pulled; start_period covers the first download.
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2h

  web:
    build:
      context: ..
      dockerfile: devops/web.Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.6}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3000"
    depends_on:
      ollama:
        condition: service_healthy

  # Unit tests for client and server against a fake Ollama; no model download.
  # docker compose -f devops/docker-compose.yml run --rm --build test
  test:
    profiles: [test]
    build:
      context: ..
      dockerfile: devops/web.Dockerfile
      target: test

volumes:
  ollama:
